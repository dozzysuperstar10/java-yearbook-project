---
- name: Configure DevOps EC2 server
  hosts: webserver
  become: true

  tasks:

    - name: Update packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true

    - name: Install Git
      ansible.builtin.dnf:
        name: git
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/devops-project
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Copy project files
      ansible.builtin.copy:
        src: "../"
        dest: "/opt/devops-project/"
        owner: ec2-user
        group: ec2-user

    - name: Start Docker Compose
      ansible.builtin.shell:
        cmd: docker compose up -d --build
        chdir: /opt/devops-project
